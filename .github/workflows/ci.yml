name: Phase 0 security CI
on:
  push:
    branches: [main, 'security/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: phase0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified official tag
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, verified official tag
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Dependency audit (all severities)
        run: npm audit --audit-level=low
      - name: Install checksum-pinned secret scanner
        run: bash scripts/install-security-scanner.sh "$RUNNER_TEMP/poki-gitleaks"
      - name: Verify scanner rejects synthetic secrets and unsafe configuration
        run: GITLEAKS_BIN="$RUNNER_TEMP/poki-gitleaks/gitleaks" node scripts/security-scan.test.mjs
      - name: Redacted history and source secret scans
        run: GITLEAKS_BIN="$RUNNER_TEMP/poki-gitleaks/gitleaks" node scripts/security-scan.mjs
      - name: Typecheck and build
        run: npm run typecheck && npm run build
      - name: Isolated tool, API, SSRF, auth and AI security tests
        run: npm test
